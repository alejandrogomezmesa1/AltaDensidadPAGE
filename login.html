<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Iniciar sesión | Fragancias de Alta Densidad</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="assets/img/Logo2026.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/img/Logo2026.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/haute-parfumerie.css">
    <link rel="stylesheet" href="assets/css/acceso.css">
    <script>
      (function() {
        var tema = null;
        try { tema = localStorage.getItem("altadensidad_tema"); } catch (e) {}
        var claro = tema === "claro";
        document.documentElement.classList.toggle("modo-claro", claro);
        document.documentElement.setAttribute("data-theme", claro ? "light" : "dark");
      })();
    </script>
</head>
<body class="acc-body">

    <header class="acc-h">
        <a class="acc-back up" href="index.html"><span aria-hidden="true">←</span> <span class="acc-back-txt">Colección</span></a>
        <a class="logo" href="index.html">Alta Densidad<small>Fragancias</small></a>
        <button id="toggleTema" class="nav-ico" type="button" aria-label="Cambiar a modo claro" title="Cambiar a modo claro"><i class="fa-solid fa-sun" aria-hidden="true"></i></button>
    </header>

    <main class="acc">
        <section class="acc-card">
            <span class="up eyebrow">Tu cuenta</span>
            <h1>Bienvenido a <em>la casa.</em></h1>

            <!-- Pestañas -->
            <div class="auth-tabs up">
                <button type="button" class="tab-btn up active" id="tabLogin" onclick="mostrarTab('login')">Iniciar sesión</button>
                <button type="button" class="tab-btn up" id="tabRegister" onclick="mostrarTab('register')">Registrarse</button>
            </div>

            <!-- Alerta -->
            <div id="alerta" class="alerta hidden" role="alert"></div>

            <!-- FORM LOGIN -->
            <form id="formLogin" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="loginEmail"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="loginEmail" placeholder="tu@correo.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword"><i class="fas fa-lock"></i> Contraseña</label>
                    <div class="input-icon">
                        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="toggle-pass" aria-label="Mostrar contraseña" onclick="togglePassword('loginPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-auth" id="btnLogin">
                    <i class="fas fa-sign-in-alt"></i> Ingresar
                </button>
                <p class="forgot-link"><a href="reset.html">¿Olvidaste tu contraseña?</a></p>
                <p class="auth-switch">¿No tienes cuenta? <a href="#" onclick="mostrarTab('register'); return false;">Regístrate</a></p>
            </form>

            <!-- FORM REGISTER -->
            <form id="formRegister" class="auth-form hidden" novalidate>
                <div class="form-group">
                    <label for="regNombre"><i class="fas fa-user"></i> Nombre completo</label>
                    <input type="text" id="regNombre" placeholder="Tu nombre" autocomplete="name" required>
                </div>
                <div class="form-group">
                    <label for="regEmail"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="regEmail" placeholder="tu@correo.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="regPassword"><i class="fas fa-lock"></i> Contraseña</label>
                    <div class="input-icon">
                        <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
                        <button type="button" class="toggle-pass" aria-label="Mostrar contraseña" onclick="togglePassword('regPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="regPassword2"><i class="fas fa-lock"></i> Confirmar contraseña</label>
                    <div class="input-icon">
                        <input type="password" id="regPassword2" placeholder="Repite tu contraseña" autocomplete="new-password" required>
                        <button type="button" class="toggle-pass" aria-label="Mostrar contraseña" onclick="togglePassword('regPassword2', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-auth" id="btnRegister">
                    <i class="fas fa-user-plus"></i> Crear cuenta
                </button>
                <p class="auth-switch">¿Ya tienes cuenta? <a href="#" onclick="mostrarTab('login'); return false;">Inicia sesión</a></p>
            </form>
        </section>
    </main>

    <footer class="acc-f up">
        <span>© 2026 Fragancias de Alta Densidad</span>
        <span>Medellín · +57 304 647 7694</span>
    </footer>

    <script src="assets/js/acceso.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
