<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" href="/assets/img/Logo2026.png" type="image/png">
    <link rel="apple-touch-icon" href="/assets/img/Logo2026.png">

    <!-- Metadatos SEO (cada página los ajusta con usePagina) -->
    <title>Fragancias de Alta Densidad | Extrait de Parfum & Perfumería de Autor en Medellín</title>
    <meta name="description" content="Exclusiva concentración Extrait de Parfum con base de feromonas. Alta perfumería inspirada en fragancias nicho con más de doce horas de fijación en Medellín, Colombia.">
    <meta name="keywords" content="perfumes alta densidad, perfumeria de autor medellin, extrait de parfum, fijacion prolongada, feromonas, fragancias nicho colombia">
    <meta name="author" content="Fragancias de Alta Densidad">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://alta-densidad-page.vercel.app/">

    <!-- Open Graph / Redes Sociales -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://alta-densidad-page.vercel.app/">
    <meta property="og:title" content="Fragancias de Alta Densidad | Puro Extrait de Parfum">
    <meta property="og:description" content="Exclusivamente en concentración Extrait de Parfum con feromonas. Estela superior a doce horas en piel a una fracción del costo del perfume comercial.">
    <meta property="og:image" content="https://alta-densidad-page.vercel.app/assets/img/Logo2026.png">
    <meta property="og:site_name" content="Fragancias de Alta Densidad">
    <meta property="og:locale" content="es_CO">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://alta-densidad-page.vercel.app/assets/img/Logo2026.png">

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "PerfumeStore",
      "name": "Fragancias de Alta Densidad",
      "description": "Casa de perfumería de autor en Medellín con exclusiva concentración Extrait de Parfum y feromonas.",
      "url": "https://alta-densidad-page.vercel.app/",
      "telephone": "+57-304-647-7694",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "calle 77c # 91b - 74",
        "addressLocality": "Medellín",
        "addressRegion": "Antioquia",
        "addressCountry": "CO"
      },
      "geo": { "@type": "GeoCoordinates", "latitude": 6.2860352, "longitude": -75.5941446 },
      "hasMap": "https://maps.google.com/?cid=12164475778803221520"
    }
    </script>

    <!-- Tipografía oficial: Cormorant Garamond (display) + Jost (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://altadensidadpage-production.up.railway.app" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- #root no genera caja: header/main/footer son hijos directos del flex de body.acc-body -->
    <style>#root { display: contents; }</style>

    <!-- Tema persistido antes de pintar (evita destellos de color) -->
    <script>
      (function() {
        try {
          var claro = localStorage.getItem("altadensidad_tema") === "claro";
          document.documentElement.classList.toggle("modo-claro", claro);
          document.documentElement.setAttribute("data-theme", claro ? "light" : "dark");
          if (localStorage.getItem("admin_sidebar") === "compacto") document.documentElement.classList.add("adm-compacto");
        } catch (e) {}
      })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
